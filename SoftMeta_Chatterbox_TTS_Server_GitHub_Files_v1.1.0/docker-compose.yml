services:
  softmeta-chatterbox:
    build: .
    ports:
      - "8004:8004"
    volumes:
      - ./outputs:/app/outputs
      - ./video_outputs:/app/video_outputs
      - ./reference_audio:/app/reference_audio
      - ./voices:/app/voices
      - ./generated_voices:/app/generated_voices
      - ./data:/app/data
      # Prepare these paths on the GPU host before enabling Avatar Talking.
      - ${SOFTMETA_ECHOMIMIC_HOST_DIR:-./external/EchoMimicV3}:/opt/EchoMimicV3:ro
      - ${SOFTMETA_ECHOMIMIC_MODELS_HOST_DIR:-./external/echomimic-models}:/models/echomimic:ro
      - ${SOFTMETA_AVATAR_ENV_HOST_DIR:-./external/softmeta-avatar}:/opt/softmeta-avatar:ro
    environment:
      SOFTMETA_HOST: 0.0.0.0
      SOFTMETA_PORT: 8004
      SOFTMETA_DEVICE: auto
      SOFTMETA_VOICE_PYTHON: /opt/softmeta-moss/bin/python
      SOFTMETA_MOSS_MODEL_DIR: /models/moss_voice_generator
      SOFTMETA_AVATAR_PYTHON: /opt/softmeta-avatar/bin/python
      SOFTMETA_ECHOMIMIC_DIR: /opt/EchoMimicV3
      SOFTMETA_ECHOMIMIC_MODELS: /models/echomimic
