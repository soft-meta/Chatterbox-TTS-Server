services:
  softmeta-chatterbox:
    build: .
    ports:
      - "8004:8004"
    volumes:
      - ./outputs:/app/outputs
      - ./reference_audio:/app/reference_audio
      - ./voices:/app/voices
      - ./data:/app/data
    environment:
      SOFTMETA_HOST: 0.0.0.0
      SOFTMETA_PORT: 8004
      SOFTMETA_DEVICE: auto
