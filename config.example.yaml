server:
  host: 0.0.0.0
  port: 8004
tts_engine:
  device: auto
  default_model: chatterbox
  predefined_voices_path: voices
  reference_audio_path: reference_audio
storage:
  outputs_path: outputs
  data_path: data
  logs_path: logs
generation_defaults:
  preset: Motivational Speech
  language: en
  temperature: 0.8
  exaggeration: 0.65
  cfg_weight: 0.35
  repetition_penalty: 1.2
  min_p: 0.05
  top_p: 1.0
  top_k: 1000
  speed_factor: 1.0
  seed: 2025
  split_text: true
  chunk_words: 90
